<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" role="img" aria-labelledby="cash-advance-timelines-t cash-advance-timelines-d"><title id="cash-advance-timelines-t">A $500 purchase versus a $500 cash advance over 60 days</title><desc id="cash-advance-timelines-d">Two timelines of 60 days. As a purchase paid in full by the due date, the grace period means no interest: cost $0. As a cash advance, a $25 fee is charged on day 1 and interest at 29.99% builds from day 1: cost about $50 when it is paid back on day 60.</desc>
<text x="0" y="16" class="h">The same $500, two ways, over 60 days</text>
<text x="0" y="44" class="cap">AS A PURCHASE, PAID IN FULL</text>
<rect x="12" y="76" width="308" height="14" class="wash"/>
<line x1="12" y1="83" x2="348" y2="83" class="ink-line"/>
<line x1="12" y1="74" x2="12" y2="92" class="ink-line"/>
<text x="12" y="108" class="xs i2">Buy</text>
<line x1="180" y1="74" x2="180" y2="92" class="ink-line"/>
<text x="180" y="108" text-anchor="middle" class="xs i2">Statement</text>
<line x1="320" y1="74" x2="320" y2="92" class="ink-line"/>
<text x="320" y="108" text-anchor="middle" class="xs i2">Paid</text>
<text x="163.2" y="68" text-anchor="middle" class="xs teal">grace period: no interest</text>
<text x="360" y="130" text-anchor="end" class="m">Cost: $0</text>
<text x="0" y="156" class="cap">AS A CASH ADVANCE</text>
<defs><pattern id="ca-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch-line"/></pattern></defs>
<path d="M12.0 203 L348.0 187 L348.0 203 Z" class="" fill="url(#ca-hatch)"/>
<line x1="12" y1="203" x2="348" y2="203" class="ink-line"/>
<line x1="12" y1="194" x2="12" y2="212" class="ink-line"/>
<line x1="348" y1="194" x2="348" y2="212" class="ink-line"/>
<rect x="12" y="218" width="104" height="20" rx="3" class="ink-fill"/><text x="64" y="232.5" text-anchor="middle" class="xs rev">$25 fee, day 1</text>
<text x="348" y="233" text-anchor="end" class="xs i2">Paid</text>
<text x="180" y="180" text-anchor="middle" class="xs i2">interest from day 1</text>
<text x="360" y="258" text-anchor="end" class="m">Cost: about $50</text>
<text x="0" y="258" class="xs i2">5% fee + 29.99% APR</text>
</svg>
