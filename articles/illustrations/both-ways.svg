<text x="24" y="298" class="xs">Saved at 4%</text>
<line x1="130" y1="294" x2="148" y2="294" class="c3-line dashed"/>
<text x="154" y="298" class="xs">Owed at 22.36%, never paid</text>
<text x="0" y="324" class="xs i2">Real cards require payments; this shows what</text>
<text x="0" y="340" class="xs i2">compounding does to any part left unpaid.</text>
</svg>
