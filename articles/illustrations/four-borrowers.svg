<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 488" role="img" aria-labelledby="four-borrowers-t four-borrowers-d"><title id="four-borrowers-t">Four kinds of borrower: a household, a city, a state and Washington</title><desc id="four-borrowers-d">A comparison in four columns. Does it issue the money it owes? Household no, city no, state no, Washington yes, because it owes dollars. Can it go bankrupt? Household yes; city yes, if its state allows it; state no; Washington no, it can&#x27;t be forced to default. Must it balance its budget? Household over time, because loans end; city and state yes, their day-to-day budgets; Washington no. In a recession: household, city and state cut back; Washington borrows more. Cities and states must balance their day-to-day budgets, so a recession forces cuts; Washington can borrow to fill the gap.</desc>
<text x="0" y="16" class="h">Four kinds of borrower</text>
<text x="0" y="36" class="s i2">Same word, debt, with different rules at each level</text>
<rect x="3" y="52" width="84" height="26" rx="4" class="c1-edge"/>
<text x="45" y="69.5" text-anchor="middle" class="s m">Household</text>
<rect x="93" y="52" width="84" height="26" rx="4" class="c2-edge"/>
<text x="135" y="69.5" text-anchor="middle" class="s m">City</text>
<rect x="183" y="52" width="84" height="26" rx="4" class="c3-edge"/>
<text x="225" y="69.5" text-anchor="middle" class="s m">State</text>
<rect x="273" y="52" width="84" height="26" rx="4" class="teal-edge"/>
<text x="315" y="69.5" text-anchor="middle" class="s m">Washington</text>
<line x1="0" y1="90" x2="360" y2="90" class="rule"/>
<text x="0" y="108" class="cap">DOES IT ISSUE THE MONEY IT OWES?</text>
<text x="45" y="132" text-anchor="middle" class="s b">No</text>
<text x="135" y="132" text-anchor="middle" class="s b">No</text>
<text x="225" y="132" text-anchor="middle" class="s b">No</text>
<text x="315" y="132" text-anchor="middle" class="s b">Yes</text>
<text x="315" y="148" text-anchor="middle" class="xs i2">it owes dollars</text>
<line x1="0" y1="158" x2="360" y2="158" class="rule"/>
<text x="0" y="176" class="cap">CAN IT GO BANKRUPT?</text>
<text x="45" y="200" text-anchor="middle" class="s b">Yes</text>
<text x="135" y="200" text-anchor="middle" class="s b">Yes</text>
<text x="135" y="216" text-anchor="middle" class="xs i2">if its state</text>
<text x="135" y="232" text-anchor="middle" class="xs i2">allows it</text>
<text x="225" y="200" text-anchor="middle" class="s b">No</text>
<text x="315" y="200" text-anchor="middle" class="s b">No</text>
<text x="315" y="216" text-anchor="middle" class="xs i2">can't be forced</text>
<text x="315" y="232" text-anchor="middle" class="xs i2">to default</text>
<line x1="0" y1="242" x2="360" y2="242" class="rule"/>
<text x="0" y="260" class="cap">MUST IT BALANCE ITS BUDGET?</text>
<text x="45" y="284" text-anchor="middle" class="s b">Over time</text>
<text x="45" y="300" text-anchor="middle" class="xs i2">loans end</text>
<text x="135" y="284" text-anchor="middle" class="s b">Yes</text>
<text x="135" y="300" text-anchor="middle" class="xs i2">day-to-day</text>
<text x="135" y="316" text-anchor="middle" class="xs i2">budget</text>
<text x="225" y="284" text-anchor="middle" class="s b">Yes</text>
<text x="225" y="300" text-anchor="middle" class="xs i2">day-to-day</text>
<text x="225" y="316" text-anchor="middle" class="xs i2">budget</text>
<text x="315" y="284" text-anchor="middle" class="s b">No</text>
<line x1="0" y1="326" x2="360" y2="326" class="rule"/>
<text x="0" y="344" class="cap">IN A RECESSION</text>
<line x1="45" y1="360" x2="45" y2="396" class="ink-line"/>
<path d="M39 388 L45 396 L51 388" class="ink-line"/>
<text x="45" y="416" text-anchor="middle" class="s b">Cuts back</text>
<line x1="135" y1="360" x2="135" y2="396" class="ink-line"/>
<path d="M129 388 L135 396 L141 388" class="ink-line"/>
<text x="135" y="416" text-anchor="middle" class="s b">Cuts back</text>
<line x1="225" y1="360" x2="225" y2="396" class="ink-line"/>
<path d="M219 388 L225 396 L231 388" class="ink-line"/>
<text x="225" y="416" text-anchor="middle" class="s b">Cuts back</text>
<line x1="315" y1="396" x2="315" y2="360" class="teal-line"/>
<path d="M309 368 L315 360 L321 368" class="teal-line"/>
<text x="315" y="416" text-anchor="middle" class="s b">Borrows more</text>
<text x="0" y="448" class="xs i2">Cities and states must balance their day-to-day</text>
<text x="0" y="464" class="xs i2">budgets, so a recession forces cuts. Washington</text>
<text x="0" y="480" class="xs i2">can borrow to fill the gap.</text>
</svg>
