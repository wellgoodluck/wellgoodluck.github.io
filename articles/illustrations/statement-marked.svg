<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 468" role="img" aria-labelledby="statement-marked-t statement-marked-d"><title id="statement-marked-t">A fictional credit card statement with three problems marked</title><desc id="statement-marked-d">A fictional card statement closing October 15: Grocery Mart $64.18; Fitness Club $29.00; Fitness Club $29.00 again, marked 1, charged twice, a billing error; Online order $112.40; ZQX*SVC 8831 $1.00, marked 2, a $1 charge you don&#x27;t know, the way thieves test cards, so call the card company now. Marked 3: the $86.00 refund from an October 1 return isn&#x27;t on the statement, which is a billing error too. To dispute any of them under federal law, the written notice must reach the card company by December 14, 60 days after October 15.</desc>
<rect x="0.5" y="0.5" width="359" height="304" rx="6" class="sheet"/>
<text x="14" y="22" class="cap">FICTIONAL · FOR ILLUSTRATION</text>
<text x="14" y="44" class="h">Card statement, closing Oct 15</text>
<text x="14" y="72" class="cap">DATE</text>
<text x="70" y="72" class="cap">DESCRIPTION</text>
<text x="310" y="72" text-anchor="end" class="cap">AMOUNT</text>
<line x1="14" y1="80" x2="346" y2="80" class="rule"/>
<text x="14" y="110" class="s i2">Oct 2</text>
<text x="70" y="110">Grocery Mart</text>
<text x="310" y="110" text-anchor="end">$64.18</text>
<line x1="14" y1="120" x2="346" y2="120" class="rule"/>
<text x="14" y="140" class="s i2">Oct 3</text>
<text x="70" y="140">Fitness Club</text>
<text x="310" y="140" text-anchor="end">$29.00</text>
<line x1="14" y1="150" x2="346" y2="150" class="rule"/>
<rect x="10" y="153" width="340" height="24" rx="3" class="wash"/>
<circle cx="334" cy="166" r="11" class="ink-fill"/><text x="334" y="170.5" text-anchor="middle" class="xs rev">1</text>
<text x="14" y="170" class="s i2">Oct 3</text>
<text x="70" y="170" class="b">Fitness Club</text>
<text x="310" y="170" text-anchor="end" class="b">$29.00</text>
<line x1="14" y1="180" x2="346" y2="180" class="rule"/>
<text x="14" y="200" class="s i2">Oct 7</text>
<text x="70" y="200">Online order</text>
<text x="310" y="200" text-anchor="end">$112.40</text>
<line x1="14" y1="210" x2="346" y2="210" class="rule"/>
<rect x="10" y="213" width="340" height="24" rx="3" class="wash"/>
<circle cx="334" cy="226" r="11" class="ink-fill"/><text x="334" y="230.5" text-anchor="middle" class="xs rev">2</text>
<text x="14" y="230" class="s i2">Oct 9</text>
<text x="70" y="230" class="b">ZQX*SVC 8831</text>
<text x="310" y="230" text-anchor="end" class="b">$1.00</text>
<line x1="14" y1="240" x2="346" y2="240" class="rule"/>
<rect x="10" y="250" width="340" height="40" rx="3" class="wash"/>
<circle cx="334" cy="271" r="11" class="ink-fill"/><text x="334" y="275.5" text-anchor="middle" class="xs rev">3</text>
<text x="14" y="267" class="s b">Not here: the $86.00 refund from</text>
<text x="14" y="283" class="s b">your Oct 1 return</text>
<circle cx="11" cy="326" r="11" class="ink-fill"/><text x="11" y="330.5" text-anchor="middle" class="xs rev">1</text>
<text x="30" y="330" class="s">Charged twice: a billing error.</text>
<circle cx="11" cy="348" r="11" class="ink-fill"/><text x="11" y="352.5" text-anchor="middle" class="xs rev">2</text>
<text x="30" y="352" class="s">A $1 charge you don&#x27;t know: thieves test</text>
<text x="30" y="374" class="s">cards this way. Call the card company now.</text>
<circle cx="11" cy="392" r="11" class="ink-fill"/><text x="11" y="396.5" text-anchor="middle" class="xs rev">3</text>
<text x="30" y="396" class="s">A refund that never posted is a billing error too.</text>
<text x="0" y="424" class="s i2">To dispute them under federal law, a written</text>
<text x="0" y="442" class="s i2">notice must reach the card company by Dec 14,</text>
<text x="0" y="460" class="s i2">60 days after the Oct 15 statement.</text>
</svg>
