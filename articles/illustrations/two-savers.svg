<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 328" role="img" aria-labelledby="two-savers-t two-savers-d"><title id="two-savers-t">Retirement balances at 65 for three savers</title><desc id="two-savers-d">Each saver puts in $4,050 a year, 6% of a $45,000 salary plus the full match, at an assumed 6% return. Starting at 22 and saving to 65: about $805,000. Starting at 32: about $418,000. Saving only from 22 to 31 and then stopping: about $387,000, nearly as much as the saver who started at 32.</desc>
<text x="0" y="16" class="h">Two savers, $4,050 a year each</text>
<text x="0" y="36" class="s i2">Balance by age, at an assumed 6% a year</text>
