<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 458" role="img" aria-labelledby="car-loan-balances-t car-loan-balances-d"><title id="car-loan-balances-t">What is still owed after five years on 5-, 6- and 7-year car loans</title><desc id="car-loan-balances-d">A chart of a $35,000 car loan at 6.9% with no down payment. At year five, the 5-year loan is paid off, the 6-year loan still owes $6,881 and the 7-year loan still owes $11,772. A car that has lost about 42% of its value by then is worth about $20,300. The value line is simplified as a straight line.</desc>
