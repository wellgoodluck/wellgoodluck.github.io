<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="overdraft-opt-in-t overdraft-opt-in-d"><title id="overdraft-opt-in-t">A fictional bank-app setting for overdraft coverage, switched off</title><desc id="overdraft-opt-in-d">A settings screen with the switch for overdraft coverage on debit card and ATM transactions turned off. Off: if there isn&#x27;t enough money, the purchase is declined, with no fee. On: the bank may pay it and charge an overdraft fee, often $35. Checks and automatic bill payments aren&#x27;t covered by this switch.</desc>
<rect x="0.5" y="0.5" width="359" height="269" rx="6" class="sheet"/>
<text x="14" y="26" class="h">Settings</text>
<text x="346" y="26" text-anchor="end" class="cap">FICTIONAL · FOR ILLUSTRATION</text>
<line x1="14" y1="38" x2="346" y2="38" class="rule"/>
<text x="14" y="64" class="m">Overdraft coverage for debit card</text>
<text x="14" y="84" class="m">and ATM transactions</text>
<rect x="294" y="58" width="52" height="28" rx="14" class="range-fill"/>
<circle cx="308" cy="72" r="11" class="sheet"/>
<text x="332" y="77" text-anchor="middle" class="xs m">Off</text>
<line x1="14" y1="104" x2="346" y2="104" class="rule"/>
<rect x="14" y="118" width="40" height="20" rx="3" class="ink-fill"/><text x="34" y="132.5" text-anchor="middle" class="xs rev">OFF</text>
<text x="64" y="133" class="s">Not enough money? The purchase</text>
<text x="64" y="151" class="s b">is declined. No fee.</text>
<rect x="14" y="168" width="40" height="20" rx="3" class="frame"/>
<text x="34" y="182.5" text-anchor="middle" class="xs m">ON</text>
<text x="64" y="183" class="s i2">The bank may pay it and charge an</text>
<text x="64" y="201" class="s i2">overdraft fee, often $35.</text>
<text x="14" y="232" class="xs i2">Checks and automatic bill payments aren't</text>
<text x="14" y="249" class="xs i2">covered by this switch.</text>
</svg>
