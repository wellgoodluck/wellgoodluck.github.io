<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256" role="img" aria-labelledby="gig-payouts-t gig-payouts-d"><title id="gig-payouts-t">Where $20,000 of app payouts goes</title><desc id="gig-payouts-d">Delivery work in 2026, federal tax, single filer. Gig work only: car costs $5,000, self-employment tax $2,120, leaving $12,880 to spend. Gig work plus a $20,000 part-time job: car costs $5,000, tax $3,290, leaving $11,710. The app pays the whole $20,000; the tax is due in April unless you pay it as you go.</desc>
