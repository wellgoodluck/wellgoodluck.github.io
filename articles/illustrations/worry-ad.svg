<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" role="img" aria-labelledby="worry-ad-t worry-ad-d"><title id="worry-ad-t">A fictional supplement ad with the four steps of a worry ad numbered</title><desc id="worry-ad-d">A made-up ad for an invented supplement, Daily Cleanse Formula. 1: the headline asks “Tired, foggy, bloated?” and says it could be “toxin overload”, a problem you didn&#x27;t know you had. 2: a countdown, “Offer ends tonight: 02:14:37”, the urgency. 3: a button, “Try it free: just $4.95 shipping”, the free first step. 4: the small print, “After 14 days, $79.95 a month until you cancel. These statements have not been evaluated by the Food and Drug Administration”, the real product.</desc>
<rect x="0.5" y="0.5" width="359" height="276" rx="6" class="sheet"/>
<text x="14" y="22" class="cap">FICTIONAL · FOR ILLUSTRATION</text>
<text x="14" y="52" class="big">Tired, foggy, bloated?</text>
<circle cx="334" cy="45" r="11" class="ink-fill"/><text x="334" y="49.5" text-anchor="middle" class="xs rev">1</text>
<text x="14" y="76" class="m">It could be “toxin overload.”</text>
<text x="14" y="96" class="s i2">Daily Cleanse Formula (an invented product)</text>
<line x1="14" y1="112" x2="346" y2="112" class="rule"/>
<text x="14" y="136" class="s">Offer ends tonight:</text>
<rect x="140" y="121" width="92" height="22" rx="3" class="ink-fill"/><text x="186" y="136.5" text-anchor="middle" class="xs rev">02:14:37</text>
<circle cx="334" cy="132" r="11" class="ink-fill"/><text x="334" y="136.5" text-anchor="middle" class="xs rev">2</text>
<rect x="14" y="156" width="248" height="40" rx="4" class="teal-fill"/>
<text x="138" y="181" text-anchor="middle" class="s rev">TRY IT FREE: just $4.95 shipping</text>
<circle cx="334" cy="176" r="11" class="ink-fill"/><text x="334" y="180.5" text-anchor="middle" class="xs rev">3</text>
<text x="14" y="224" class="xs i2">After 14 days, $79.95 a month until you</text>
<text x="14" y="241" class="xs i2">cancel. These statements have not been</text>
<text x="14" y="258" class="xs i2">evaluated by the Food and Drug Administration.</text>
<circle cx="334" cy="240" r="11" class="ink-fill"/><text x="334" y="244.5" text-anchor="middle" class="xs rev">4</text>
<circle cx="11" cy="303" r="11" class="ink-fill"/><text x="11" y="307.5" text-anchor="middle" class="xs rev">1</text>
<text x="30" y="308" class="s">A problem you didn't know you had</text>
<circle cx="11" cy="331" r="11" class="ink-fill"/><text x="11" y="335.5" text-anchor="middle" class="xs rev">2</text>
<text x="30" y="336" class="s">Urgency</text>
<circle cx="11" cy="359" r="11" class="ink-fill"/><text x="11" y="363.5" text-anchor="middle" class="xs rev">3</text>
<text x="30" y="364" class="s">A “free” first step</text>
<circle cx="11" cy="387" r="11" class="ink-fill"/><text x="11" y="391.5" text-anchor="middle" class="xs rev">4</text>
<text x="30" y="392" class="s">The real product, in the small print</text>
</svg>
