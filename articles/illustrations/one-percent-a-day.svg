<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="one-percent-a-day-t one-percent-a-day-d"><title id="one-percent-a-day-t">What 1% a day would do to $1,000 in a year</title><desc id="one-percent-a-day-d">A curve rising slowly and then steeply, from $1,000 on day 0 to about $37,800 on day 365, nearly 38 times the money. A dashed line for comparison: a 10% year, ending at $1,100. No legitimate investment reliably does anything close.</desc>
<text x="0" y="16" class="h">$1,000 at "just 1% a day"</text>
<text x="0" y="36" class="s i2">Compounded every day for a year</text>
