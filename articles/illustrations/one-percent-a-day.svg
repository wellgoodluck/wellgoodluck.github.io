<text x="38" y="240" text-anchor="end" class="xs mu">$0</text>
<line x1="44" y1="191" x2="350" y2="191" class="rule"/>
<text x="38" y="195" text-anchor="end" class="xs mu">$10K</text>
<line x1="44" y1="146" x2="350" y2="146" class="rule"/>
<text x="38" y="150" text-anchor="end" class="xs mu">$20K</text>
<line x1="44" y1="101" x2="350" y2="101" class="rule"/>
<text x="38" y="105" text-anchor="end" class="xs mu">$30K</text>
<line x1="44" y1="56" x2="350" y2="56" class="rule"/>
<text x="38" y="60" text-anchor="end" class="xs mu">$40K</text>
<text x="44" y="254" class="xs mu">Day 0</text>
<text x="119.452" y="254" text-anchor="middle" class="xs mu">90</text>
<text x="194.904" y="254" text-anchor="middle" class="xs mu">180</text>
<text x="270.356" y="254" text-anchor="middle" class="xs mu">270</text>
<text x="350" y="254" text-anchor="end" class="xs mu">365</text>
