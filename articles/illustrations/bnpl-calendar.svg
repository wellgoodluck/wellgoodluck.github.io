<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" role="img" aria-labelledby="bnpl-calendar-t bnpl-calendar-d"><title id="bnpl-calendar-t">A month of four buy now, pay later plans</title><desc id="bnpl-calendar-d">A calendar of four weeks. Four pay-in-4 plans were started on the 1st, 3rd, 4th and 6th: a hoodie ($22.50 a payment), headphones ($60), sneakers ($45) and concert tickets ($15). Week 1 holds the four first payments, $142.50. Week 2 nothing. Week 3 all four are due again, on the 15th, 17th, 18th and 20th, $142.50, three of them before the payday on the 19th. Week 4 nothing.</desc>
<text x="0" y="16" class="h">Four plans, one month</text>
<text x="0" y="36" class="s i2">Each pays a quarter now and every two weeks after.</text>
