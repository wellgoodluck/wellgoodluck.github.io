<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="finfluencer-post-t finfluencer-post-d"><title id="finfluencer-post-t">A fictional social media post with four warning signs marked</title><desc id="finfluencer-post-d">A made-up post from an invented account, TotallyRealGains: &quot;My system makes 1% a day. Guaranteed. I never lose. Only 20 spots left this week! DM me to join the VIP group. Deposits in crypto only.&quot; Four warning signs are numbered: 1, a steady, guaranteed return, when real investments go up and down; 2, urgency, so you don&#x27;t stop to check; 3, a move to a private chat or group; 4, payment in crypto, gift cards or wires.</desc>
<rect x="0.5" y="0.5" width="359" height="250" rx="6" class="sheet"/>
<text x="14" y="22" class="cap">FICTIONAL · FOR ILLUSTRATION</text>
<circle cx="34" cy="52" r="18" class="range-fill"/>
<text x="34" y="57" text-anchor="middle" class="s b">TG</text>
<text x="62" y="48" class="m">TotallyRealGains</text>
<text x="62" y="66" class="xs i2">@totally.real.gains.example</text>
<text x="26" y="102">My system makes 1% a day.</text>
<circle cx="330" cy="97" r="11" class="ink-fill"/>
<text x="330" y="101.5" text-anchor="middle" class="xs rev">1</text>
<text x="26" y="126">Guaranteed. I never lose.</text>
<text x="26" y="150">Only 20 spots left this week!</text>
<circle cx="330" cy="145" r="11" class="ink-fill"/>
<text x="330" y="149.5" text-anchor="middle" class="xs rev">2</text>
<text x="26" y="174">DM me to join the VIP group.</text>
<circle cx="330" cy="169" r="11" class="ink-fill"/>
<text x="330" y="173.5" text-anchor="middle" class="xs rev">3</text>
<text x="26" y="198">Deposits in crypto only.</text>
<circle cx="330" cy="193" r="11" class="ink-fill"/>
<text x="330" y="197.5" text-anchor="middle" class="xs rev">4</text>
<line x1="14" y1="216" x2="346" y2="216" class="rule"/>
<text x="26" y="236" class="xs mu">12.4K likes · 3,108 shares</text>
<circle cx="11" cy="275" r="11" class="ink-fill"/>
<text x="11" y="279.5" text-anchor="middle" class="xs rev">1</text>
<text x="30" y="280" class="s">A steady, guaranteed return. Real</text>
<text x="30" y="298" class="s i2">investments go up and down.</text>
<circle cx="11" cy="321" r="11" class="ink-fill"/>
<text x="11" y="325.5" text-anchor="middle" class="xs rev">2</text>
<text x="30" y="326" class="s">Urgency, so you don&#x27;t stop to check.</text>
<circle cx="11" cy="349" r="11" class="ink-fill"/>
<text x="11" y="353.5" text-anchor="middle" class="xs rev">3</text>
<text x="30" y="354" class="s">A move to a private chat or group.</text>
<circle cx="11" cy="377" r="11" class="ink-fill"/>
<text x="11" y="381.5" text-anchor="middle" class="xs rev">4</text>
<text x="30" y="382" class="s">Payment in crypto, gift cards or wires.</text>
</svg>
