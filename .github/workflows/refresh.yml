name: Refresh data and publish

# Runs twice each weekday (10:15 and 17:15 Eastern during daylight time, an hour
# earlier in winter), after the morning data releases and after the afternoon ones.
# Also runs on demand, and when the fetch script itself changes. Edits to the
# pages, articles and styles are published by publish.yml without a fetch.
on:
  schedule:
    - cron: "15 14,21 * * 1-5"
  push:
    branches: [main]
    paths:
      - fetch_fred.py
      - .github/workflows/refresh.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          # The tip of main, not the commit that triggered the run: an earlier
          # run may have committed fresh figures while this one waited its turn.
          ref: main

      - name: Fetch the latest figures from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 fetch_fred.py public/data/series.json

      - name: Keep a copy of the figures in the repo
        # Also keeps the repository "active": GitHub switches off scheduled
        # workflows in public repos after 60 days without a commit.
        # If the commit cannot land (someone pushed meanwhile), the site still
        # publishes from the files just fetched; the next run catches up.
        run: |
          mkdir -p data
          cp public/data/series.json data/series.json
          cp public/data/companions.json data/companions.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/companions.json
          if [ -f data/firstprints.json ]; then git add data/firstprints.json; fi
          if git diff --cached --quiet; then
            echo "Figures unchanged; nothing to commit."
          else
            git commit -m "Refresh figures, $(date -u +%Y-%m-%d)"
            if ! git pull --rebase; then
              git rebase --abort
              echo "Could not rebase onto newer commits; skipping the data commit this run."
            elif ! git push; then
              echo "Push rejected; skipping the data commit this run."
            fi
          fi

      - name: Assemble the site
        run: |
          cp index.html chart.html public/
          cp data/overlays.json public/data/
          if [ -d assets ]; then cp -r assets public/; fi
          python3 tools/build_articles.py public
          ls -R public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
