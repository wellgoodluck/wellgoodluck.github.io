name: Publish site changes

# Publishes edits to the pages, articles, styles and overlays without
# fetching any data. It assembles the site from the figures the last refresh
# committed to data/, so an article push publishes in about a minute and a half.
# The refresh workflow still publishes on its own schedule.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - chart.html
      - "*.html"
      - assets/**
      - articles/**
      - tools/**
      - data/overlays.json
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as the refresh workflow, so the two never deploy at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Assemble the site from the committed figures
        run: |
          mkdir -p public/data
          cp ./*.html public/
          cp data/series.json data/companions.json data/overlays.json public/data/
          if [ -d assets ]; then cp -r assets public/; fi
          python3 tools/build_articles.py public
          ls -R public

      - name: Index the site for search
        # Nov 14: Pagefind reads the built pages and writes public/pagefind/ (never committed). If it fails, the site
        # still publishes and the search page says search didn't load. The check prints headline searches that miss.
        continue-on-error: true
        run: |
          npx --yes pagefind@1.6.0 --site public
          node tools/search_check.mjs public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    # Nov 24: the deploy runs in its own job, after the upload job finishes. In one
    # job, deploy-pages sometimes asks for the artifact a split second after it was
    # saved, finds none, and fails with "No artifacts named github-pages"
    # (actions/deploy-pages#451). If a deploy still fails, use "Re-run failed jobs"
    # so only this job runs again: "Re-run all jobs" uploads a second copy, and the
    # lookup then fails on the duplicate.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
